<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4b6b"/>
      <stop offset="1" stop-color="#1e2638"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0b45a"/>
      <stop offset="1" stop-color="#b8742a"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="22" fill="url(#bg)"/>
  <!-- pixel canvas -->
  <g transform="translate(22 22)">
    <rect width="60" height="60" rx="4" fill="#f4f6fa"/>
    <rect x="0"  y="0"  width="15" height="15" fill="#e8475a"/>
    <rect x="15" y="0"  width="15" height="15" fill="#f39a3d"/>
    <rect x="30" y="0"  width="15" height="15" fill="#f6d34a"/>
    <rect x="0"  y="15" width="15" height="15" fill="#f39a3d"/>
    <rect x="15" y="15" width="15" height="15" fill="#f6d34a"/>
    <rect x="30" y="15" width="15" height="15" fill="#5ccf6e"/>
    <rect x="0"  y="30" width="15" height="15" fill="#f6d34a"/>
    <rect x="15" y="30" width="15" height="15" fill="#5ccf6e"/>
    <rect x="0"  y="45" width="15" height="15" fill="#5ccf6e"/>
    <rect width="60" height="60" rx="4" fill="none" stroke="#c9d0dc" stroke-width="2"/>
  </g>
  <!-- brush -->
  <g transform="rotate(45 78 78)">
    <rect x="72" y="58" width="12" height="52" rx="6" fill="url(#handle)"/>
    <rect x="71" y="50" width="14" height="12" rx="2" fill="#c7ccd6"/>
    <path d="M71 50 C71 38 74 30 78 24 C82 30 85 38 85 50 Z" fill="#4aa3ff"/>
  </g>
</svg>
